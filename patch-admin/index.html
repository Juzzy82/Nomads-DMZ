<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Patch notes admin</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080808;color:#e8e4d6;font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:28px 18px 60px}h1{margin:0 0 6px;font-size:1.5rem;color:#ffd275;letter-spacing:.04em}p{color:#b9bdb0;margin:0 0 18px}
label{display:block;margin:0 0 8px;font-size:.9rem;color:#cfcbbb}input{width:100%;max-width:340px;padding:10px 12px;background:#0e0f0b;border:1px solid #3a3a2c;color:#fff;font:inherit}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 18px}button{padding:10px 16px;border:1px solid #9a7a3a;background:#241d0d;color:#ffd275;font:600 .8rem/1 ui-monospace,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}button:hover{background:#33290f}button:disabled{opacity:.5;cursor:wait}
pre{white-space:pre-wrap;word-break:break-word;background:#0e0f0b;border:1px solid #2a2a20;padding:14px;min-height:120px;font:.85rem/1.5 ui-monospace,Consolas,monospace;color:#d8d4c6}a{color:#ffd275}
</style></head><body><main>
<h1>Patch notes admin</h1>
<p>For the site owner only. The password is typed here each time and is never saved in this browser.</p>
<label for="pw">Admin password</label><input id="pw" type="password" autocomplete="off" spellcheck="false">
<div class="row"><button id="check">Check now</button><button id="review">Show held items</button><button id="diag">Show status</button></div>
<pre id="out" aria-live="polite">Nothing run yet.</pre>
<p><a href="/patch-notes/">Open the public Patch Notes page</a></p>
</main>
<script src="/patch-admin/admin.js" defer></script></body></html>
